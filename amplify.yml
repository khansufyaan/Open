version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -e PRIVY_APP_SECRET >> .env.production || true
        - env | grep -e BRIDGE_API_KEY >> .env.production || true
        - env | grep -e BRIDGE_COMPANY_CUSTOMER_ID >> .env.production || true
        - env | grep -e BRIDGE_COMPANY_WALLET_ID >> .env.production || true
        - env | grep -e ADMIN_SECRET >> .env.production || true
        - env | grep -e PLAID_CLIENT_ID >> .env.production || true
        - env | grep -e PLAID_SECRET >> .env.production || true
        - env | grep -e PLAID_ENV >> .env.production || true
        - env | grep -e COMPANY_WALLET_ADDRESS >> .env.production || true
        - env | grep -e SURCHARGE_PERCENTAGE >> .env.production || true
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
